name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run smoke test
        run: node test/smoke.mjs

      # The end-to-end suite needs a signed-in cmd and network, so CI only proves
      # that it parses. Run it locally with `node test/e2e.mjs`.
      - name: Check the end-to-end suite parses
        run: node --check test/e2e.mjs
